name: Build Vita Mahjong Bot APK

on:
  push:
    branches: ["vita-mahjong-bot-build"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Restore project
        run: |
          mkdir -p vita-mahjong-bot
          base64 -d .vita-build/project.zip.b64 > /tmp/project.zip
          unzip -q /tmp/project.zip -d vita-mahjong-bot
      - name: Build debug APK
        working-directory: vita-mahjong-bot
        run: gradle --no-daemon assembleDebug
      - name: Collect APK
        run: |
          cp vita-mahjong-bot/app/build/outputs/apk/debug/app-debug.apk VitaMahjongBot-v0.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VitaMahjongBot-v0.2-debug
          path: VitaMahjongBot-v0.2-debug.apk
          if-no-files-found: error
